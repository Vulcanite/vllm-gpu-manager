global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/vllm-targets.yml
        refresh_interval: 5s

  - job_name: nvidia-dcgm
    static_configs:
      - targets:
          - 127.0.0.1:9400
        labels:
          exporter: dcgm
