name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Test backend
        run: go test ./...

      - name: Check dependency licenses
        run: ./scripts/check-licenses.sh

      - name: Install packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo apt-get update
          sudo apt-get install -y lintian

      - name: Build portable Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            binary_name="vllm-manager-${TAG_NAME}-linux-${arch}"
            version="${TAG_NAME#v}"
            GOARCH="${arch}" go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/${binary_name}" .
            chmod +x "dist/${binary_name}"
          done

      - name: Build Debian packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          NFPM_BIN="$(go env GOPATH)/bin/nfpm" ./scripts/build-packages.sh
          rm -f dist/vllm-manager-linux-amd64 dist/vllm-manager-linux-arm64 dist/changelog.gz

      - name: Validate Debian packages
        run: |
          for package in dist/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package" >/dev/null
          done
          lintian --fail-on error dist/*.deb

      - name: Create checksums and license artifacts
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* --title "${TAG_NAME}" --generate-notes
          fi
