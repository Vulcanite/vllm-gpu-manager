name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, test, and docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Vet backend
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0

      - name: Test backend
        run: go test -v -race ./...

      - name: Install documentation dependencies
        run: npm ci

      - name: Type-check documentation
        run: npm run typecheck

      - name: Build Docusaurus documentation
        run: npm run docs:build

      - name: Check dependency licenses
        run: ./scripts/check-licenses.sh

      - name: Validate packaging scripts
        run: |
          bash -n scripts/*.sh
          sh -n packaging/scripts/*.sh
